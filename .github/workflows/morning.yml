name: Morning Trading Strategy

on:
  schedule:
    # PRIMARY TRIGGER: the Cloudflare Worker in scheduler/ starts this workflow on time via
    # workflow_dispatch. GitHub's own cron below is only a BACKUP: on this repo it has started
    # runs 4-7 hours late. A late backup run exits quietly if the work is already done.
    # One backup attempt only: morning and afternoon share a concurrency group, and GitHub keeps
    # just ONE pending run per group (a newer arrival cancels the waiting one). Several late
    # backups could cancel the afternoon run that the Worker queued.
    # 13:07 UTC = 08:07 EST / 09:07 EDT, inside the 07:00-09:25 window if it ever runs on time.
    # src/main.py checks Alpaca's market calendar, so a late run does nothing (or fails loudly
    # if no plan exists for today, which means the Worker's runs failed too).
    - cron: '7 13 * * 1-5'
  workflow_dispatch: # "Run workflow" button for manual tests

# One bot job at a time across both workflows, so runs never race on data/*.json or place duplicate orders.
concurrency:
  group: trading-bot-data
  cancel-in-progress: false

jobs:
  run-morning:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest is moving to 26.04; upgrade on purpose, not by surprise
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Morning Strategy
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python src/main.py

      - name: Commit and Push Data
        if: always() # save the plan even if an order failed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data
          git commit -m "🤖 Auto-update morning plan [skip ci]" || exit 0
          git pull --rebase origin main
          git push
