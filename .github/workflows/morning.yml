name: Morning Trading Strategy

on:
  schedule:
    - cron: '30 13 * * 1-5' # 13:30 UTC / 8:30 AM EST (Mon-Fri)
  workflow_dispatch: # This line adds a "Run Workflow" button in GitHub so you can test it manually

jobs:
  run-morning:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Morning Strategy
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python src/main.py

      - name: Commit and Push Targets
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/targets.json
          git commit -m "🤖 Auto-update morning targets [skip ci]" || exit 0
          git push