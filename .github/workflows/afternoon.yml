name: Afternoon Trade Evaluator

on:
  schedule:
    # 21:15 UTC = 16:15 EST / 17:15 EDT, always after the close. Running late is fine:
    # src/evaluator.py scores the session saved in targets.json, not "today". If this
    # run never happens, the next morning run evaluates the missed session first.
    - cron: '15 21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: trading-bot-data
  cancel-in-progress: false

jobs:
  run-afternoon:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Afternoon Evaluator
        run: python src/evaluator.py

      - name: Commit and Push Results
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/results.json
          git commit -m "📊 Auto-update EOD performance results [skip ci]" || exit 0
          git pull --rebase origin main
          git push
